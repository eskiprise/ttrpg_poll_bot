name: Deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch: {}

permissions:
  id-token: write # required for AWS OIDC
  contents: read

env:
  AWS_REGION: eu-west-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build deployment package
        run: ./build.sh

      - name: Zip Lambda package
        run: |
          cd build
          zip -r ../function.zip . -x "__pycache__/*"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Lambda function code
        env:
          # develop -> the dev stack's 3 functions, main -> the prod stack's 3 functions.
          # Only ever touches the one stack matching the branch pushed.
          STAGE: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
        run: |
          for fn in \
            "telegram-poll-bot-${STAGE}-webhook" \
            "telegram-poll-bot-${STAGE}-notifySignup" \
            "telegram-poll-bot-${STAGE}-notifyFeedback"; do
            aws lambda update-function-code --function-name "$fn" --zip-file fileb://function.zip
            aws lambda wait function-updated --function-name "$fn"
          done
